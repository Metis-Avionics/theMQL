[workspace]
resolver = "2"
members = [
    "crates/themql-core",
    "crates/themql-schema",
    "crates/themql-message",
    "crates/themql-query",
    "crates/themql-runtime",
    "crates/themql-cache",
    "crates/themql-storage",
    "crates/themql-transport",
    "crates/themql-graphql",
    "crates/themql-mqtt",
    "crates/themql-sse",
    "crates/themql-telemetry",
    "crates/themql-analysis",
    "crates/themql-training",
    "crates/themql-inference",
    "crates/themql-gnc",
    "crates/themql-estimation",
    "crates/themql-artifact",
    "crates/themql-embedded",
    "crates/themql-desktop",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Metis-Avionics/theMQL"
documentation = "https://github.com/Metis-Avionics/theMQL"
homepage = "https://github.com/Metis-Avionics/theMQL"
description = "Native Rust message-query runtime for desktop, distributed, telemetry, analysis, AI, GNC, and embedded systems."
authors = ["Metis Avionics"]
keywords = ["message", "query", "telemetry", "gnc", "embedded"]
categories = ["embedded", "science", "network-programming"]

# Versions resolved against crates.io 2026-08-19.
# Crate Cargo.tomls reference these via `dep.workspace = true`.
[workspace.dependencies]
# Core / runtime
tokio = "1"
rayon = "1"
apalis = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Transport / API
async-graphql = "8.0.0-rc.5"
embassy-sync = "0.8"
embassy-executor = "0.10"
embassy-time = "0.5"

# Embedded sensor / MQTT deps
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-io-async = "0.7"
minimq = "0.13"

# Cache / storage
cachelito = "0.16"
moka = "0.12"
valkey = "0.0.0-alpha5"
helix-db = "3"

# Desktop / analysis
dioxus = "0.5"
polars = "0.55"

# ML
tch = "0.24"
ndarray = "0.17"
nalgebra = "0.35"

# Tooling
clap = "4"
ratatui = "0.30"
serde-big-array = "0.5"

# Identity / hashing
uuid = { version = "1", features = ["v7", "serde"] }
blake3 = "1"
thiserror = "2"

# Serialisation / KV
bincode = "1"
lru = "0.18"
redis = { version = "0.27", features = ["tokio-comp"] }
sled = "0.34"

# Embedded
heapless = "0.8"
cortex-m-rt = "0.7"
embedded-alloc = "0.7"
static_cell = "2"

# HTTP / MQTT
axum = "0.8"
async-graphql-axum = "8.0.0-rc.5"
rumqttc = "0.24"
futures-util = "0.3"

# Auth
better-auth = { version = "0.10", features = ["axum", "rustls"], default-features = false }

# Testing
proptest = "1"
criterion = { version = "0.5", features = ["async_tokio"] }

# Internal crates — self-references for cross-crate deps via workspace=true
# version is required alongside path so `cargo publish` can rewrite
# the requirement to the crates.io version on packaging.
themql-core = { version = "0.2.0", path = "crates/themql-core" }
themql-schema = { version = "0.2.0", path = "crates/themql-schema" }
themql-message = { version = "0.2.0", path = "crates/themql-message" }
themql-query = { version = "0.2.0", path = "crates/themql-query" }
themql-runtime = { version = "0.2.0", path = "crates/themql-runtime" }
themql-cache = { version = "0.2.0", path = "crates/themql-cache" }
themql-storage = { version = "0.2.0", path = "crates/themql-storage" }
themql-transport = { version = "0.2.0", path = "crates/themql-transport" }
themql-graphql = { version = "0.2.0", path = "crates/themql-graphql" }
themql-mqtt = { version = "0.2.0", path = "crates/themql-mqtt" }
themql-sse = { version = "0.2.0", path = "crates/themql-sse" }
themql-telemetry = { version = "0.2.0", path = "crates/themql-telemetry" }
themql-analysis = { version = "0.2.0", path = "crates/themql-analysis" }
themql-training = { version = "0.2.0", path = "crates/themql-training" }
themql-inference = { version = "0.2.0", path = "crates/themql-inference" }
themql-gnc = { version = "0.2.0", path = "crates/themql-gnc" }
themql-estimation = { version = "0.2.0", path = "crates/themql-estimation" }
themql-artifact = { version = "0.2.0", path = "crates/themql-artifact" }
themql-embedded = { version = "0.2.0", path = "crates/themql-embedded" }
themql-desktop = { version = "0.2.0", path = "crates/themql-desktop" }

[profile.dev]
debug = true
split-debuginfo = "unpacked"

[profile.release]
debug = false
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
debug = false
lto = "thin"
codegen-units = 1