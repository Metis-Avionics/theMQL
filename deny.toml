# deny.toml — cargo-deny configuration
# Run: cargo deny check
# Install: cargo install cargo-deny
# Docs: https://embarkstudios.github.io/cargo-deny/

[licenses]
# Allow only licenses compatible with MIT (the project license).
# List of SPDX identifiers: https://spdx.org/licenses/
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
# ring uses a complex license; clarify to allow it if it appears transitively.
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Deny multiple versions of the same crate (with exceptions for known cases).
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

# Crates that must never be used.
deny = [
    # No Python runtime — SPEC.tomL [architecture.forbidden] python_runtime = true
    { name = "pyo3", reason = "Python ABI bridge — spec-forbidden" },
    { name = "cpython", reason = "Python ABI bridge — spec-forbidden" },
    { name = "python3-sys", reason = "Python ABI bridge — spec-forbidden" },
]

# Crates that are allowed but should be monitored.
skip = []
skip-tree = []

[sources]
# Only allow crates from crates.io + git sources explicitly listed here.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
# Check for known vulnerabilities in dependencies.
version = 2
db-urls = ["https://github.com/RustSec/advisory-db"]
# Vulnerabilities with these IDs are ignored (with reason).
# These are unmaintained/unsound advisories in transitive deps of
# sled, redis, rumqttc, axum, and async-graphql-axum that don't
# affect our usage. Reassess when upstream deps are updated.
#
# Every entry below is either (a) resolved upstream so it is gone, or
# (b) carries the PROOF that no available action fixes it, plus the
# exact condition that unblocks it. "Not reachable" on its own is not
# an acceptable reason; see scripts/check-advisory-rationales.sh.
ignore = [
    "RUSTSEC-2025-0141",  # unmaintained: atty (transitive via sled/redis)
    "RUSTSEC-2025-0057",  # unmaintained: paste (transitive)
    "RUSTSEC-2024-0384",  # unmaintained: proc-macro-error (transitive)
    "RUSTSEC-2025-0134",  # unmaintained: transitive dep
    "RUSTSEC-2026-0110",  # unmaintained: bare-metal (transitive via cortex-m/embassy)
    "RUSTSEC-2026-0173",  # unmaintained: proc-macro-error2 (transitive via better-auth)

    # ---------------------------------------------------------------------
    # rustls-webpki 0.102.8 — BLOCKED UPSTREAM, not a reachability question.
    #
    # Four advisories live in the 0.102.x line:
    #   RUSTSEC-2026-0049  CRL Distribution Point matching
    #   RUSTSEC-2026-0098  URI name constraints
    #   RUSTSEC-2026-0099  wildcard name constraints
    #   RUSTSEC-2026-0104  CRL BIT STRING panic (DoS)
    # All four are fixed only in >= 0.103.10/12/13. There is NO patched
    # 0.102.x: 0.102.8 is the last release on that line, so the fixes were
    # never backported.
    #
    # The blocker is rumqttc, not us. Verified against the crates.io index:
    #   - rumqttc's newest release is 0.25.1.
    #   - EVERY rumqttc release from 0.19 onward requires
    #     rustls-webpki "^0.102", which cannot resolve to 0.103.x.
    #   - No rumqttc release requires rustls-webpki 0.103. Verified by
    #     scanning the index metadata for every rumqttc version.
    # So `cargo update` cannot fix this, and a [patch.crates-io] to 0.103.x
    # is rejected by cargo as semver-incompatible (0.102 -> 0.103).
    #
    # The lock contains BOTH lines: rustls 0.23.45 (better-auth) already
    # pulls the patched rustls-webpki 0.103.14. Only rumqttc's copy is
    # affected, and only rumqttc's own TLS paths reach it.
    #
    # UNBLOCK CONDITION: a rumqttc release requiring rustls-webpki >= 0.103.13.
    # Re-check with: scripts/check-advisory-rationales.sh
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",

    # ---------------------------------------------------------------------
    # jsonwebtoken 9.3.1 — type confusion in nbf/exp validation, which can
    # lead to an authorization bypass (GHSA-h395-gr6q-cpjc).
    #
    # Not reachable in this workspace, and the reachability claim is now
    # enforced by a test rather than asserted in prose. See
    # crates/themql-desktop/tests/auth_reachability.rs, which fails if a
    # JWT-issuing plugin is ever registered.
    #
    # Why it is not reachable:
    #   - The only plugin registered is EmailPasswordPlugin
    #     (crates/themql-desktop/src/main.rs:314). No JWT plugin.
    #   - Sessions are opaque `session_` tokens; theMQL mirrors
    #     SessionManager::extract_session_token rather than validating a JWT.
    #   - Auth is off unless --enable-auth is passed (default_value_t = false).
    # jsonwebtoken is reached only through better-auth 0.10.0, which
    # requires jsonwebtoken "^9" and therefore cannot resolve to the fixed
    # 10.3.0 — this is a semver major, not a lock update.
    #
    # UNBLOCK CONDITION: better-auth >= 1.0.0-alpha.3 (requires
    # jsonwebtoken ^11, i.e. patched). Taking an alpha dependency on a
    # 0.x crate is a deliberate decision, not a side effect of a security
    # bump, so it is not done unilaterally here.
    "GHSA-h395-gr6q-cpjc",
]
